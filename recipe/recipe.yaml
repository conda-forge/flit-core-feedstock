schema_version: 1

context:
  version: "4.0.2"
  python_min: "3.8"

package:
  name: flit-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flit/flit-${{ version }}.tar.gz
  sha256: 232bc4317279e8952eca9fb3f5e000d8395d693b39c105b99f619ce461e1da85
  target_directory: source

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps -vv source/flit_core/

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
  run_constraints:
    - flit ${{ version }}.*

tests:
  - python:
      imports:
        - flit_core
        - flit_core.common
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: source/LICENSE
  summary: Simplified packaging of Python modules
  homepage: https://flit.readthedocs.io/

extra:
  recipe-maintainers:
    - takluyver
    - beckermr
